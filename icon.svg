<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;display=swap');
      .num { 
        font-family: 'Orbitron', Impact, sans-serif; 
        font-weight: 900; 
        font-size: 320px; 
        text-anchor: middle; 
        dominant-baseline: middle; 
        font-style: italic;
      }
    </style>
    
    <!-- Top layer gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="40%" stop-color="#e60000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>

    <!-- Neon underglow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark Background -->
  <rect width="512" height="512" fill="#050505"/>
  
  <!-- Glowing shadow -->
  <text x="50%" y="54%" class="num" fill="#ff0000" filter="url(#neonGlow)" opacity="0.6">11</text>

  <!-- 3D Extrusion (Bottom right) -->
  <text x="55%" y="60%" class="num" fill="#1a0000">11</text>
  <text x="54%" y="59%" class="num" fill="#330000">11</text>
  <text x="53%" y="58%" class="num" fill="#4d0000">11</text>
  <text x="52%" y="57%" class="num" fill="#660000">11</text>
  <text x="51%" y="56%" class="num" fill="#800000">11</text>

  <!-- Main Top Face -->
  <text x="50%" y="55%" class="num" fill="url(#redGrad)">11</text>
  
  <!-- Glossy Bevel / Highlight at the top edge -->
  <text x="49%" y="54%" class="num" fill="none" stroke="#fff" stroke-width="3" opacity="0.4">11</text>
</svg>
